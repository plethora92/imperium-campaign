name: Campaign Update

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  test:
    if: >
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'plethora92'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test OpenAI with campaign input
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAMPAIGN_INPUT: ${{ github.event.comment.body }}
        run: |
          RESPONSE=$(curl -s https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$(jq -n \
              --arg input "$CAMPAIGN_INPUT" \
              '{
                model: "gpt-5.6",
                input: ("Campaign input: " + $input + "\n\nReply briefly confirming that you received it.")
              }')")

          echo "$RESPONSE" | jq .

          TEXT=$(echo "$RESPONSE" | jq -r '
            [.output[]?.content[]? |
             select(.type == "output_text") |
             .text] |
            join("\n")
          ')

          echo "GPT RESPONSE:"
          echo "$TEXT"

          echo "$TEXT" > response.txt

      - name: Reply to the campaign input
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "🤖 Campaign automation received your input and successfully contacted OpenAI.

          **GPT response:**

          $(cat response.txt)"
