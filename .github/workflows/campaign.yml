name: Campaign Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test OpenAI API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "gpt-5.6",
              "input": "Reply with exactly: CAMPAIGN CONNECTION OK"
            }'

      - name: Test repository write
        run: |
          echo "# Campaign Automation Test" > automation-test.md
          echo "" >> automation-test.md
          echo "GitHub Actions can write to this repository." >> automation-test.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation-test.md
          git commit -m "test: verify automated repository write"
          git push
